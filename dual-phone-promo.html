<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>Community Badge Promo</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
    }
    .phones {
      position: relative;
      width: 100vw;
      height: 100dvh;
      min-height: 640px;
      perspective: 1800px;
      transform-style: preserve-3d;
    }

    .orbits {
      position: absolute;
      z-index: 0;
      top: 50%;
      left: 50%;
      width: min(1120px, 96vw);
      height: min(720px, 92vh);
      overflow: visible;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .orbits--front {
      z-index: 3;
    }

    .orbit {
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .orbit-base {
      stroke: rgba(150, 157, 173, .28);
      opacity: .62;
    }

    .orbit-flow {
      stroke-width: 6;
      stroke-dasharray: 42 58;
      opacity: 1;
      animation: orbit-flow 7.8s linear infinite;
    }

    .orbit-flow--two {
      stroke-dasharray: 36 64;
      animation-duration: 9.6s;
      animation-direction: reverse;
    }

    .orbit-flow--three {
      stroke-dasharray: 31 69;
      animation-duration: 6.8s;
      animation-delay: -2.4s;
    }

    .orbit-front-base {
      stroke: rgba(145, 152, 169, .3);
      opacity: .68;
    }

    .orbit-front-flow {
      stroke-width: 6;
      stroke-dasharray: 40 60;
      opacity: 1;
      animation: orbit-flow 7.8s linear infinite;
    }

    .orbit-front-flow--two {
      stroke-dasharray: 34 66;
      animation-duration: 9.6s;
      animation-direction: reverse;
    }

    .orbit-front-flow--three {
      stroke-dasharray: 29 71;
      animation-duration: 6.8s;
      animation-delay: -2.4s;
    }

    .glass-anchor {
      position: absolute;
      z-index: 4;
      top: 50%;
      left: 50%;
      pointer-events: none;
    }

    .glass-chip {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 184px;
      height: 68px;
      padding: 10px 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .62);
      border-radius: 19px;
      color: #fff;
      font: 700 20px/1.1 Satoshi, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .1px;
      white-space: nowrap;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(95, 73, 154, .62), rgba(35, 29, 61, .38) 54%, rgba(139, 116, 208, .38));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .36),
        inset 0 -1px 0 rgba(109, 82, 180, .34),
        0 12px 32px rgba(38, 29, 69, .22),
        0 0 0 1px rgba(143, 111, 229, .22);
      will-change: transform;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      animation: glass-float var(--float-duration, 4s) cubic-bezier(.45, .05, .55, .95) var(--float-delay, 0s) infinite;
    }

    .glass-chip::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(112deg, rgba(255, 255, 255, .24), transparent 34%, transparent 70%, rgba(179, 157, 255, .18));
    }

    .glass-chip img,
    .glass-chip span {
      position: relative;
      z-index: 1;
    }

    .glass-chip img {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
    }

    .glass-anchor--badges {
      transform: translate(-620px, -310px);
    }

    .glass-anchor--badges .glass-chip {
      --float-distance: 10px;
      --float-duration: 4.2s;
    }

    .glass-anchor--level {
      transform: translate(-625px, 225px);
    }

    .glass-anchor--level .glass-chip {
      --float-distance: 13px;
      --float-duration: 4.8s;
      --float-delay: -1.1s;
    }

    .glass-anchor--action {
      transform: translate(395px, 225px);
    }

    .glass-anchor--action .glass-chip {
      min-width: 190px;
      --float-distance: 9px;
      --float-duration: 4.4s;
      --float-delay: -2.2s;
    }

    @keyframes glass-float {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, calc(var(--float-distance, 10px) * -1), 0); }
    }

    @keyframes orbit-flow {
      to { stroke-dashoffset: -100; }
    }

    .phone {
      position: absolute;
      top: 50%;
      left: 50%;
      overflow: visible;
      transform-style: preserve-3d;
      transform-origin: 50% 50%;
      box-shadow: 0 34px 38px rgba(0, 0, 0, .25);
    }

    .device-screen {
      position: absolute;
      z-index: 2;
      inset: 0;
      overflow: hidden;
      border-radius: inherit;
      background: #050506;
      box-shadow:
        inset 0 0 0 3px #030304,
        inset 0 0 0 5px rgba(255, 255, 255, .045);
    }

    .device-back {
      position: absolute;
      z-index: 0;
      pointer-events: none;
      border-radius: inherit;
      background:
        linear-gradient(90deg, #171520 0%, #71618a 20%, #2d2939 46%, #17161f 75%, #9080aa 100%);
      box-shadow:
        inset 1px 0 1px rgba(255, 255, 255, .52),
        inset -2px -2px 4px rgba(0, 0, 0, .58),
        0 8px 0 rgba(18, 16, 24, .9),
        0 14px 24px rgba(0, 0, 0, .34);
    }

    .phone--coinw .device-back {
      inset: 3px 5px -9px -8px;
    }

    .phone--otc .device-back {
      inset: 3px -8px -9px 5px;
    }

    .device-frame {
      position: absolute;
      z-index: 4;
      inset: -1px;
      padding: 4px;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(135deg,
          #f4edff 0%,
          #8a78a8 9%,
          #2a2733 23%,
          #74658e 42%,
          #15141b 62%,
          #a995c7 82%,
          #3b3548 100%);
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }

    .device-glass {
      position: absolute;
      z-index: 3;
      inset: 5px;
      border-radius: 42px;
      pointer-events: none;
      box-shadow:
        inset 1px 1px 0 rgba(255, 255, 255, .16),
        inset -1px -1px 0 rgba(0, 0, 0, .72);
    }

    .device-button {
      position: absolute;
      z-index: 5;
      width: 7px;
      border: 1px solid rgba(226, 213, 255, .4);
      border-radius: 5px;
      pointer-events: none;
      background: linear-gradient(90deg, #26222f, #8d7ba8 52%, #2a2634);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .72);
    }

    .phone--coinw .device-button { left: -8px; }
    .phone--coinw .device-button--one { top: 126px; height: 50px; }
    .phone--coinw .device-button--two { top: 190px; height: 82px; }
    .phone--coinw .device-button--three { top: 287px; height: 82px; }
    .phone--otc .device-button { right: -8px; }
    .phone--otc .device-button--one { top: 132px; height: 62px; }
    .phone--otc .device-button--two { top: 224px; height: 104px; }
    .phone--otc .device-button--three { display: none; }

    .device-bottom {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: -8px;
      width: 112px;
      height: 8px;
      border-radius: 0 0 12px 12px;
      pointer-events: none;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #84739e, #292531 72%, #15131a);
      box-shadow: inset 0 1px rgba(255, 255, 255, .25);
    }

    .phone iframe {
      position: absolute;
      display: block;
      border: 0;
      pointer-events: auto;
    }

    /* 左侧手机：靠后、略向左倾斜 */
    .phone--coinw {
      z-index: 1;
      width: 390px;
      height: 844px;
      border-radius: 48px;
      animation: coinw-enter 1800ms cubic-bezier(.22, 1, .36, 1) both;
    }

    .phone--coinw iframe {
      inset: 0;
      width: 390px;
      height: 844px;
    }

    /* 右侧手机：位于前景，压住左侧手机 */
    .phone--otc {
      z-index: 2;
      width: 391px;
      height: 828px;
      border-radius: 46px;
      animation: otc-enter 1800ms cubic-bezier(.22, 1, .36, 1) 80ms both;
    }

    .phone--otc iframe {
      inset: 0;
      width: 390px;
      height: 844px;
    }

    @keyframes coinw-enter {
      0% {
        opacity: 0;
        transform: translate3d(-50%, -50%, 0) rotateZ(0deg) scale(.76);
      }
      18% { opacity: 1; }
      68% {
        opacity: 1;
        transform: translate3d(-82%, -48%, 0) rotateZ(-8deg) scale(.80);
      }
      100% {
        opacity: 1;
        transform: translate3d(-72%, -50%, 0) rotateZ(0deg) scale(.80);
      }
    }

    @keyframes otc-enter {
      0% {
        opacity: 0;
        transform: translate3d(-50%, -50%, 0) rotateZ(0deg) scale(.78);
      }
      18% { opacity: 1; }
      68% {
        opacity: 1;
        transform: translate3d(-18%, -54%, 0) rotateZ(14deg) scale(.815);
      }
      100% {
        opacity: 1;
        transform: translate3d(-12%, -50%, 0) rotateZ(0deg) scale(.815);
      }
    }

    @media (max-width: 760px) {
      .phones {
        min-height: 520px;
      }

      .phone--coinw {
        animation-name: coinw-enter-tablet;
      }

      .phone--otc {
        animation-name: otc-enter-tablet;
      }

      @keyframes coinw-enter-tablet {
        0% { opacity: 0; transform: translate3d(-50%, -50%, 0) rotateZ(0deg) scale(.52); }
        18% { opacity: 1; }
        68% { opacity: 1; transform: translate3d(-72%, -47%, 0) rotateZ(-8deg) scale(.54); }
        100% { opacity: 1; transform: translate3d(-68%, -50%, 0) rotateZ(0deg) scale(.54); }
      }

      @keyframes otc-enter-tablet {
        0% { opacity: 0; transform: translate3d(-50%, -50%, 0) rotateZ(0deg) scale(.53); }
        18% { opacity: 1; }
        68% { opacity: 1; transform: translate3d(-29%, -54%, 0) rotateZ(14deg) scale(.55); }
        100% { opacity: 1; transform: translate3d(-16%, -50%, 0) rotateZ(0deg) scale(.55); }
      }
    }

    @media (max-width: 430px) {
      .phone--coinw {
        animation-name: coinw-enter-mobile;
      }

      .phone--otc {
        animation-name: otc-enter-mobile;
      }

      @keyframes coinw-enter-mobile {
        0% { opacity: 0; transform: translate3d(-50%, -50%, 0) rotateZ(0deg) scale(.43); }
        18% { opacity: 1; }
        68% { opacity: 1; transform: translate3d(-67%, -47%, 0) rotateZ(-8deg) scale(.45); }
        100% { opacity: 1; transform: translate3d(-66%, -50%, 0) rotateZ(0deg) scale(.45); }
      }

      @keyframes otc-enter-mobile {
        0% { opacity: 0; transform: translate3d(-50%, -50%, 0) rotateZ(0deg) scale(.44); }
        18% { opacity: 1; }
        68% { opacity: 1; transform: translate3d(-34%, -54%, 0) rotateZ(14deg) scale(.46); }
        100% { opacity: 1; transform: translate3d(-18%, -50%, 0) rotateZ(0deg) scale(.46); }
      }
    }

    /* 主站案例卡片为横向短视口，按可用高度完整收纳两台手机。 */
    @media (max-height: 520px) {
      .phones {
        height: 100dvh;
        min-height: 0;
      }

      .phone--coinw {
        animation-name: coinw-enter-embed;
      }

      .phone--otc {
        animation-name: otc-enter-embed;
      }

      @keyframes coinw-enter-embed {
        0% { opacity: 0; transform: translate3d(-50%, -50%, 0) rotateZ(0deg) scale(.34); }
        18% { opacity: 1; }
        68% { opacity: 1; transform: translate3d(-84%, -48%, 0) rotateZ(-8deg) scale(.40); }
        100% { opacity: 1; transform: translate3d(-76%, -50%, 0) rotateZ(0deg) scale(.40); }
      }

      @keyframes otc-enter-embed {
        0% { opacity: 0; transform: translate3d(-50%, -50%, 0) rotateZ(0deg) scale(.35); }
        18% { opacity: 1; }
        68% { opacity: 1; transform: translate3d(-25%, -54%, 0) rotateZ(12deg) scale(.41); }
        100% { opacity: 1; transform: translate3d(-18%, -50%, 0) rotateZ(0deg) scale(.41); }
      }
    }

    @media (max-height: 300px) {
      @keyframes coinw-enter-embed {
        0% { opacity: 0; transform: translate3d(-50%, -50%, 0) rotateZ(0deg) scale(.18); }
        18% { opacity: 1; }
        68% { opacity: 1; transform: translate3d(-84%, -48%, 0) rotateZ(-8deg) scale(.22); }
        100% { opacity: 1; transform: translate3d(-77%, -50%, 0) rotateZ(0deg) scale(.22); }
      }

      @keyframes otc-enter-embed {
        0% { opacity: 0; transform: translate3d(-50%, -50%, 0) rotateZ(0deg) scale(.19); }
        18% { opacity: 1; }
        68% { opacity: 1; transform: translate3d(-25%, -54%, 0) rotateZ(12deg) scale(.225); }
        100% { opacity: 1; transform: translate3d(-17%, -50%, 0) rotateZ(0deg) scale(.225); }
      }
    }

    /* 手机外机固定为宣传图构图；仅屏幕内部动画继续播放。 */
    .phone--coinw {
      animation: none !important;
      transform: translate3d(-95%, -48%, 0) rotateZ(-8deg) scale(.80);
    }

    .phone--otc {
      animation: none !important;
      transform: translate3d(-2%, -54%, 0) rotateZ(9deg) scale(.815);
    }

    @media (max-width: 760px) {
      .phone--coinw { transform: translate3d(-82%, -47%, 0) rotateZ(-8deg) scale(.54); }
      .phone--otc { transform: translate3d(-13%, -54%, 0) rotateZ(9deg) scale(.55); }
      .glass-anchor--badges { transform: translate(-350px, -225px) scale(.72); }
      .glass-anchor--level { transform: translate(-355px, 155px) scale(.72); }
      .glass-anchor--action { transform: translate(165px, 155px) scale(.72); }
    }

    @media (max-width: 430px) {
      .phone--coinw { transform: translate3d(-77%, -47%, 0) rotateZ(-8deg) scale(.45); }
      .phone--otc { transform: translate3d(-18%, -54%, 0) rotateZ(9deg) scale(.46); }
      .glass-anchor--badges { transform: translate(-210px, -195px) scale(.56); }
      .glass-anchor--level { transform: translate(-215px, 128px) scale(.56); }
      .glass-anchor--action { transform: translate(70px, 128px) scale(.56); }
    }

    @media (max-height: 520px) {
      .phone--coinw { transform: translate3d(-95%, -48%, 0) rotateZ(-8deg) scale(.40); }
      .phone--otc { transform: translate3d(-9%, -54%, 0) rotateZ(9deg) scale(.41); }
      .glass-anchor--badges { transform: translate(-370px, -182px) scale(.62); }
      .glass-anchor--level { transform: translate(-372px, 112px) scale(.62); }
      .glass-anchor--action { transform: translate(178px, 112px) scale(.62); }
    }

    @media (max-height: 300px) {
      .phone--coinw { transform: translate3d(-95%, -48%, 0) rotateZ(-8deg) scale(.22); }
      .phone--otc { transform: translate3d(-9%, -54%, 0) rotateZ(9deg) scale(.225); }
      .glass-anchor--badges { transform: translate(-245px, -105px) scale(.38); }
      .glass-anchor--level { transform: translate(-247px, 62px) scale(.38); }
      .glass-anchor--action { transform: translate(80px, 62px) scale(.38); }
    }

    @media (min-height: 301px) and (max-height: 500px) {
      .phones { min-height: 0; }
      .phone--coinw { transform: translate3d(-68%, -50%, 0) rotateZ(-8deg) scale(.34); }
      .phone--otc { transform: translate3d(-32%, -50%, 0) rotateZ(9deg) scale(.35); }
      .glass-anchor--badges { transform: translate(-278px, -155px) scale(.50); }
      .glass-anchor--level { transform: translate(-280px, 118px) scale(.50); }
      .glass-anchor--action { transform: translate(92px, 118px) scale(.50); }
    }

    .orbit-base,
    .orbit-front-base,
    .orbits--back .orbit-flow--two,
    .orbits--back .orbit-flow--three {
      display: none;
    }

    .orbit-flow {
      stroke-width: 2.5;
      stroke-dasharray: 14 86;
    }

    .orbits--front .orbit-front-flow--two,
    .orbits--front .orbit-front-flow--three {
      display: none;
    }

    .orbit-front-flow {
      stroke-width: 2.5;
      stroke-dasharray: 16 84;
      animation-duration: 6.4s;
    }

    @media (prefers-reduced-motion: reduce) {
      .phone { animation-duration: 1ms; animation-delay: 0ms; }
      .orbit-flow,
      .orbit-front-flow { animation: none; }
    }
  </style>
</head>
<body>
  <main class="phones" aria-label="Community badge mobile promotion">
    <svg class="orbits orbits--back" viewBox="0 0 1120 720" aria-hidden="true">
      <defs>
        <linearGradient id="orbit-white-a" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#b8bfcc" stop-opacity="0"></stop>
          <stop offset=".2" stop-color="#d4d9e3" stop-opacity=".18"></stop>
          <stop offset=".4" stop-color="#f7f8fa" stop-opacity=".58"></stop>
          <stop offset=".52" stop-color="#fff" stop-opacity=".82"></stop>
          <stop offset=".66" stop-color="#f1f3f7" stop-opacity=".54"></stop>
          <stop offset=".84" stop-color="#cbd1dc" stop-opacity=".16"></stop>
          <stop offset="1" stop-color="#b5bdca" stop-opacity="0"></stop>
        </linearGradient>
        <linearGradient id="orbit-white-b" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#b6becb" stop-opacity=".1"></stop>
          <stop offset=".2" stop-color="#d1d6e0" stop-opacity=".34"></stop>
          <stop offset=".4" stop-color="#f5f6f9" stop-opacity=".82"></stop>
          <stop offset=".54" stop-color="#fff" stop-opacity=".96"></stop>
          <stop offset=".7" stop-color="#eceef3" stop-opacity=".8"></stop>
          <stop offset=".88" stop-color="#cbd1dc" stop-opacity=".32"></stop>
          <stop offset="1" stop-color="#b3bbc8" stop-opacity=".1"></stop>
        </linearGradient>
      </defs>
      <ellipse class="orbit orbit-base" cx="560" cy="360" rx="520" ry="350" stroke="url(#orbit-white-a)" transform="rotate(-4 560 360)"></ellipse>
      <ellipse class="orbit orbit-flow" pathLength="100" cx="560" cy="360" rx="520" ry="350" stroke="url(#orbit-white-a)" transform="rotate(-4 560 360)"></ellipse>
      <ellipse class="orbit orbit-base" cx="580" cy="360" rx="500" ry="335" stroke="url(#orbit-white-b)" transform="rotate(6 580 360)"></ellipse>
      <ellipse class="orbit orbit-flow orbit-flow--two" pathLength="100" cx="580" cy="360" rx="500" ry="335" stroke="url(#orbit-white-b)" transform="rotate(6 580 360)"></ellipse>
      <ellipse class="orbit orbit-base" cx="570" cy="365" rx="480" ry="320" stroke="url(#orbit-white-a)" transform="rotate(-8 570 365)"></ellipse>
      <ellipse class="orbit orbit-flow orbit-flow--three" pathLength="100" cx="570" cy="365" rx="480" ry="320" stroke="url(#orbit-white-a)" transform="rotate(-8 570 365)"></ellipse>
    </svg>

    <div class="glass-anchor glass-anchor--badges" aria-hidden="true">
      <div class="glass-chip">
        <img src="./assets/cases/community-badge-demo/badge-full-orange.svg" alt="">
        <span>7 Badges</span>
      </div>
    </div>
    <div class="glass-anchor glass-anchor--level" aria-hidden="true">
      <div class="glass-chip">
        <img src="./assets/cases/community-badge-demo/badge-full-orange.svg" alt="">
        <span>Lv.2</span>
      </div>
    </div>
    <div class="glass-anchor glass-anchor--action" aria-hidden="true">
      <div class="glass-chip">
        <span>Wear Now</span>
      </div>
    </div>

    <div class="phone phone--coinw">
      <span class="device-back" aria-hidden="true"></span>
      <div class="device-screen">
        <iframe
          src="./community-badge-detail-demo.html?v=figma-svg-5"
          title="Badge Details"
          allow="autoplay"
          allowtransparency="true"
        ></iframe>
      </div>
      <span class="device-glass" aria-hidden="true"></span>
      <span class="device-frame" aria-hidden="true"></span>
      <span class="device-button device-button--one" aria-hidden="true"></span>
      <span class="device-button device-button--two" aria-hidden="true"></span>
      <span class="device-button device-button--three" aria-hidden="true"></span>
      <span class="device-bottom" aria-hidden="true"></span>
    </div>

    <div class="phone phone--otc">
      <span class="device-back" aria-hidden="true"></span>
      <div class="device-screen">
        <iframe
          src="./community-badge-wall-demo.html?v=figma-svg-5"
          title="Badge Wall"
          allow="autoplay"
          allowtransparency="true"
        ></iframe>
      </div>
      <span class="device-glass" aria-hidden="true"></span>
      <span class="device-frame" aria-hidden="true"></span>
      <span class="device-button device-button--one" aria-hidden="true"></span>
      <span class="device-button device-button--two" aria-hidden="true"></span>
      <span class="device-button device-button--three" aria-hidden="true"></span>
      <span class="device-bottom" aria-hidden="true"></span>
    </div>

    <svg class="orbits orbits--front" viewBox="0 0 1120 720" aria-hidden="true">
      <defs>
        <linearGradient id="orbit-front-white-a" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#b7bfcc" stop-opacity="0"></stop>
          <stop offset=".18" stop-color="#d4d9e3" stop-opacity=".2"></stop>
          <stop offset=".4" stop-color="#f7f8fa" stop-opacity=".68"></stop>
          <stop offset=".52" stop-color="#fff" stop-opacity=".96"></stop>
          <stop offset=".68" stop-color="#f1f3f7" stop-opacity=".64"></stop>
          <stop offset=".86" stop-color="#cbd1dc" stop-opacity=".18"></stop>
          <stop offset="1" stop-color="#b5bdca" stop-opacity="0"></stop>
        </linearGradient>
        <linearGradient id="orbit-front-white-b" x1="1" y1="0" x2="0" y2="0">
          <stop offset="0" stop-color="#b5bdca" stop-opacity=".1"></stop>
